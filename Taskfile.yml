version: "3"

tasks:
  build:
    desc: Build taskrail CLI
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build ./cmd/taskrail

  build:cross:
    desc: Cross-compile ./cmd/taskrail for non-native release targets (compile smoke; publishes nothing)
    # Pure GOOS/GOARCH compile check for the platforms Taskrail ships to or intends
    # to run on; -o /dev/null keeps it a smoke (no artifact). windows/arm64 is the
    # optional T-058 release target, compile-checked so it cannot break silently
    # between tags. Guarded by TestTaskfileCrossTargetCoversRequiredPlatforms.
    env:
      CGO_ENABLED: "0"
    cmds:
      - |
        set -e
        for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/arm64; do
          echo "cross-compiling $target"
          GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/taskrail
        done

  release:
    desc: Build taskrail CLI with an injected release version (VERSION=v<version> task release)
    vars:
      VERSION: '{{.VERSION | default "0.0.0-dev"}}'
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o taskrail ./cmd/taskrail

  taskrail:install:
    desc: Build the working-tree taskrail CLI onto the mise-provided PATH (./bin)
    # CGO_ENABLED=0 + -trimpath + -buildvcs=false make the build byte-reproducible
    # so taskrail:check can compare it against a fresh build; the .exe suffix on
    # Windows lets a bare `taskrail` resolve via PATHEXT. Both build sites must keep
    # these identical — guarded by TestTaskrailBuildsShareReproducibleFlags.
    #
    # -buildvcs=false is load-bearing, not tidiness. Go stamps vcs.revision,
    # vcs.time and vcs.modified into a binary built inside a Git repository and
    # -trimpath does not strip them, so identical source produces different bytes
    # once HEAD moves or the worktree goes dirty. Nothing reads those stamps here
    # (version reports its own constant), so dropping them costs nothing and stops
    # the guard reporting an unchanged binary as stale.
    #
    # The pathcheck step makes a build that nothing resolves as `taskrail` a loud
    # failure rather than a success the caller is no better off for: the skills run
    # ${TASKRAIL:-taskrail}, so an unreachable ./bin means they keep running the
    # installed release (T-123). An explicit TASKRAIL override satisfies it.
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -trimpath -buildvcs=false -o bin/taskrail{{if eq OS "windows"}}.exe{{end}} ./cmd/taskrail
      - go run ./internal/toolchain/cmd/pathcheck bin/taskrail{{if eq OS "windows"}}.exe{{end}}

  taskrail:check:
    desc: Fail if the taskrail on PATH is not the current working-tree build (cross-platform; native Windows too)
    # Builds a fresh binary with the same reproducible flags as taskrail:install
    # (CGO_ENABLED=0 + -trimpath + -buildvcs=false) and hands it to the freshcheck
    # helper, which
    # resolves the on-PATH taskrail and byte-compares them. That helper stands in
    # for the POSIX-only coreutils the old check used, so it runs on a stock
    # native Windows install with none of them on PATH (T-082); the fixed output
    # path lives under the gitignored bin/ and the helper deletes it.
    #
    # The second argument is where taskrail:install writes. freshcheck needs it to
    # tell "the source moved on" from "the binary you would run is not the one you
    # just built" — different causes with different remedies (T-123).
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -trimpath -buildvcs=false -o bin/taskrail-freshcheck{{if eq OS "windows"}}.exe{{end}} ./cmd/taskrail
      - go run ./internal/toolchain/cmd/freshcheck bin/taskrail-freshcheck{{if eq OS "windows"}}.exe{{end}} bin/taskrail{{if eq OS "windows"}}.exe{{end}}

  test:
    desc: Run all tests
    deps: [taskrail:install]
    cmds:
      - go test -timeout 60m ./...

  test:short:
    desc: Run the tests minus the long working-binary suites (local hook lane; CI runs `test`)
    deps: [taskrail:install]
    cmds:
      - go test -short ./...

  test:filesystem:
    desc: Run native filesystem portability tests verbosely, including capability skips
    cmds:
      - go test -v ./internal/durablefs ./internal/durabletx ./internal/repolock ./internal/repotx
      - go test -v ./internal/taskrail -run '^(TestParseFrontmatterHandlesCRLF|TestAppendTaskNoteTwiceKeepsOneHeading|TestApplyImportDraftResolvesSpecRefAgainstPendingImportedSpec|TestDecodeDecompositionBundlePreservesCompleteValidBundle|TestDiscoverPathsLinkedWorktreePreservesGitIdentities)$'

  test:commit-msg:
    desc: Test the commit-message policy
    cmds:
      - scripts/check-commit-msg-test.sh

  test:author:
    desc: Test the agent-identity author guard
    cmds:
      - scripts/check-author-test.sh

  test:push-messages:
    desc: Test the pre-push attribution guard
    cmds:
      - scripts/check-push-messages-test.sh

  test:orb-setup:
    desc: Test the committed Amp orb lifecycle setup
    cmds:
      - scripts/check-orb-setup-test.sh

  test:workflow-contract:
    desc: Run the manifest-selected deterministic workflow-contract suites
    cmds:
      - go run ./internal/taskrail/cmd/workflow-contract

  vet:
    desc: Run go vet across all packages
    cmds:
      - go vet ./...

  fmt:check:
    desc: Fail if any Go file needs gofmt
    cmds:
      - |
        out="$(gofmt -l .)"
        if [ -n "$out" ]; then
          echo "gofmt needed on:" >&2
          echo "$out" >&2
          exit 1
        fi

  coverage:gate:
    desc: Fail if active-spec decomposition coverage drops below 100% (repo self-coverage gate)
    # Dogfoods `coverage --min` (T-066): the gate lives only on this command's exit
    # code, so validate stays advisory (a coverage gap never fails validate). The
    # threshold pins the current clean 100% self-coverage; a spec area shipped
    # without a linked task reds the push. N/A (a spec with no coverable areas)
    # exits zero, so activating a freshly-scaffolded spec does not red the gate.
    cmds:
      - go run ./cmd/taskrail coverage --min 100

  run:help:
    desc: Run taskrail help
    cmds:
      - go run ./cmd/taskrail --help

  validate:
    desc: Validate Taskrail planning structure
    cmds:
      - go run ./cmd/taskrail validate

  next:
    desc: Select next eligible task
    cmds:
      - go run ./cmd/taskrail next --json

  check:skills:
    desc: Verify committed .agents/.claude skills match the embedded package (parity)
    cmds:
      - go test ./internal/taskrail -run '^TestCommittedSkillsMatchPackage$'

  check:task-bodies:
    desc: Verify no task file repeats a scaffold section heading
    cmds:
      - go test ./internal/taskrail -run '^TestCorpusTasksHaveOneOfEachScaffoldSection$|^TestDuplicateScaffoldSectionsFlagsRepeatedHeadings$|^TestScaffoldSectionHeadingsMatchScaffoldOutput$'

  check:docs:
    desc: Run the tests that pin the repository's real documentation (AGENTS.md, README.md, docs/, specs/, ...)
    # ci.yml ignores doc-only paths, so these run in planning.yml and the
    # lefthook docs hook; otherwise a reworded contract fails first on a later,
    # unrelated code PR. The list is every internal/taskrail test that fails when
    # the documentation files are absent; keep it in step when adding one.
    cmds:
      - go test ./internal/toolchain
      - go test ./internal/taskrail -run '^TestGapGatingContractIsDocumentedAtSources$|^TestSkillsOverviewStatesGapMechanicalLimit$|^TestDocsSkillListsMatchShippableSet$|^TestWorkflowDocsKeepArtifactsEphemeral$|^TestAutonomousContractNamesCurrentSkillAndBinarySources$|^TestAutonomousContractCitesCanonicalLifecycleRegistry$|^TestV04ShippedPrerequisitesAreDocumented$|^TestWorkflowContractCurrentGuidanceRetiresSourceCheckoutLoopAndKeepsProviderBoundary$|^TestTaskImplementationSpecRejectsReportOnlyFindingDisposition$|^TestMachineInventoryMatchesCompanionRegistry$|^TestMachineRegistriesMatchNormativeSources$|^TestMachineInventoryErrorSubsetsMatchCompanionAssignment$|^TestMachineInventoryWarningSubsetsMatchCompanionAssignment$|^TestMachineExitPoliciesMatchTheSpecGatingList$'

  check:state:
    desc: Fail if planning/STATE.md drifted from its task-file projection (repair would change it) or does not validate
    # repair exits 0 on a dry run even when it finds drift; statecheck reads its
    # JSON envelope and turns drift into a failure. A plain pipe, so Task's
    # built-in shell runs it on native Windows as well.
    cmds:
      - go run ./cmd/taskrail repair --json | go run ./internal/toolchain/cmd/statecheck

  lint:
    desc: Run golangci-lint (version pinned in mise.toml, config in .golangci.yml)
    cmds:
      - golangci-lint run ./...

  check:
    desc: Run every task-based check of CI's checks and build-test jobs locally (mirrors ci.yml)
    # Guarded by TestLocalCheckMirrorsTheCIJobs: the order and set match the
    # ci.yml checks job, then the unconditional build-test steps, then
    # build:cross. Steps that are not `task` calls or run only on one matrix leg
    # are left out.
    cmds:
      - task: fmt:check
      - task: lint
      - task: check:skills
      - task: test:commit-msg
      - task: test:author
      - task: test:push-messages
      - task: test:orb-setup
      - task: check:state
      - task: taskrail:install
      - task: taskrail:check
      - task: coverage:gate
      - task: build
      - task: vet
      - task: test:filesystem
      - task: test:workflow-contract
      - task: test
      - task: run:help
      - task: validate
      - task: build:cross

  check:planning:
    desc: Run the planning fast lane locally (mirrors planning.yml)
    # Guarded by TestLocalPlanningCheckMirrorsThePlanningWorkflow.
    cmds:
      - task: validate
      - task: check:task-bodies
      - task: check:state
      - task: check:docs
      - task: coverage:gate
      - task: test:workflow-contract

  skills:regen:
    desc: Regenerate committed .agents/.claude skill copies from the embedded package, then verify parity
    # Copies straight from the embedded source (internal/taskrail/skills) rather
    # than `init --with-skills`, so it needs no built binary and never writes the
    # `.taskrail/` layout marker. Run after editing a packaged skill; the trailing
    # check:skills fails loud if the copies still diverge.
    cmds:
      - rm -rf .agents/skills .claude/skills
      - mkdir -p .agents/skills .claude/skills
      - cp -R internal/taskrail/skills/. .agents/skills/
      - cp -R internal/taskrail/skills/. .claude/skills/
      - task check:skills

  hooks:install:
    desc: Install opt-in git hooks via lefthook (pre-commit, commit-msg, pre-push)
    cmds:
      - |
        if ! command -v lefthook >/dev/null 2>&1; then
          echo "lefthook not found. Install it, then re-run 'task hooks:install':" >&2
          echo "  go install github.com/evilmartians/lefthook@v1.13.6" >&2
          echo "  # or: brew install lefthook" >&2
          exit 1
        fi
        lefthook install
