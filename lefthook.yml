# Local git hooks for taskrail (opt-in).
#
# Install:  task hooks:install   (runs `lefthook install`)
# These hooks mirror the fast checks in .github/workflows/ci.yml; CI remains the
# authoritative gate. Pinned tool version: lefthook v1.13.6 (see Taskfile
# `hooks:install`). Do not bypass hooks with `--no-verify`.

pre-commit:
  parallel: true
  commands:
    # Identity is checked on every commit, not per file: an agent runner's git
    # config carries no staged file of its own to key off. A runner that keeps
    # its own name credits the agent through the author header, which is the
    # same claim the forbidden trailers make in the body.
    author-identity:
      run: bash scripts/check-author.sh
    guard-checkers:
      glob: "{lefthook.yml,Taskfile.yml,scripts/check-commit-msg.sh,scripts/check-attribution.sh,scripts/check-author.sh,scripts/check-push-messages.sh,scripts/check-*-test.sh}"
      run: task test:commit-msg && task test:author && task test:push-messages
    gofmt:
      glob: "*.go"
      run: |
        unformatted="$(gofmt -l {staged_files})"
        if [ -n "$unformatted" ]; then
          echo "gofmt needed on:" >&2
          echo "$unformatted" >&2
          exit 1
        fi
    vet:
      run: task vet
    validate:
      run: task validate
    skill-parity:
      run: task check:skills
    # Tracked-work commands write task and state files. A binary older than the
    # working tree writes them without erroring, so the damage is only visible by
    # reading the files afterwards (T-123). Refusing the commit closes that window
    # locally; CI's freshness leg remains the authoritative gate.
    taskrail-freshness:
      run: task taskrail:check

commit-msg:
  commands:
    conventional:
      run: bash scripts/check-commit-msg.sh {1}

pre-push:
  commands:
    # The commit-msg hook is skipped by `--no-verify`, by a rebase, and by an
    # amend that reuses a message. This is the last gate before history leaves
    # the machine, and it runs before the suite: a push that has to be
    # rewritten anyway should not first pay for the tests.
    message-policy:
      priority: 1
      run: bash scripts/check-push-messages.sh
    tests:
      priority: 2
      run: task test:short
