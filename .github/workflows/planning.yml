name: Planning checks

# Fast lane for planning-/spec-/doc-only changes. The full CI matrix and cross-compile
# in ci.yml skip these paths (see paths-ignore there), so this workflow preserves the two
# cheap gates that matter most exactly when planning files change — taskrail state
# validation, task-body hygiene, and active-spec coverage — without spinning up the
# cross-platform build/test matrix. A gate that guards committed planning content has to
# live here: ci.yml never runs for a change that touches only these paths. Its `paths:` set is the exact mirror of the paths ignored by ci.yml; keep them
# identical. release.yml (tags-only) is unaffected.
on:
  push:
    branches:
      - main
    paths:
      - 'planning/**'
      - 'specs/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
  pull_request:
    paths:
      - 'planning/**'
      - 'specs/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'

permissions:
  contents: read

concurrency:
  group: planning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Planning + docs checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Validate Taskrail planning structure
        run: task validate

      - name: Check task bodies for duplicate Implementation Notes headings
        run: task check:task-bodies

      - name: Gate active-spec self-coverage (coverage --min 100)
        run: task coverage:gate
